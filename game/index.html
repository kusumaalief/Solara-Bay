<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay — a blocky open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eef1f5; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud.dim { opacity: 0.35; }
  .panel { background: rgba(10, 14, 24, 0.62); border-radius: 10px; padding: 10px 14px; }
  #topleft { position: absolute; top: 14px; left: 14px; }
  #cash { font-size: 26px; font-weight: 700; color: #5ad68a; }
  #healthbar { width: 180px; height: 12px; background: #222; border-radius: 6px; margin-top: 6px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #5ad68a; }
  #topright { position: absolute; top: 14px; right: 14px; text-align: right; }
  #stars { font-size: 26px; color: #ffd23a; letter-spacing: 2px; text-shadow: 0 1px 4px #000; }
  #minimap { display: block; margin-top: 6px; border: 2px solid rgba(255,255,255,0.7); border-radius: 8px; background: #1c2a1e; }
  #objective { position: absolute; left: 50%; bottom: 86px; transform: translateX(-50%); font-size: 17px; font-weight: 600; text-align: center; max-width: 640px; }
  #message { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 16px; color: #ffd23a; text-shadow: 0 1px 4px #000; }
  #speed { position: absolute; right: 18px; bottom: 16px; font-size: 18px; font-weight: 600; }
  #hint { position: absolute; left: 14px; bottom: 14px; font-size: 13px; color: #c8cfdb; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; font-size: 18px; text-align: center; color: #fff; text-shadow: 0 0 4px #000; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 12, 22, 0.55); }
  #overlay.hidden { display: none; }
  #overlay-card { background: rgba(12, 18, 30, 0.92); border-radius: 16px; padding: 28px 36px; max-width: 620px; text-align: center; }
  #overlay-title { font-size: 44px; font-weight: 800; letter-spacing: 2px; color: #ffd23a; margin: 0 0 12px; }
  #overlay-lines { font-size: 16px; line-height: 1.6; color: #c8cfdb; }
  #overlay-prompt { margin-top: 16px; font-size: 16px; color: #f2c94c; }
  #overlay-card button { pointer-events: auto; margin: 14px 6px 0; padding: 10px 20px; font-size: 16px; border-radius: 8px; border: none; background: #ffd23a; color: #111; font-weight: 700; cursor: pointer; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Solara Bay: a blocky open-world crime game. Move with WASD, drive cars, complete missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud">
  <div id="topleft" class="panel"><div id="cash">$120</div><div id="healthbar"><div id="health-fill"></div></div></div>
  <div id="topright"><div id="stars">☆☆☆☆☆</div><canvas id="minimap" width="190" height="142"></canvas></div>
  <div id="objective" class="panel">Steal a car, then reach the docks marker</div>
  <div id="message"></div>
  <div id="speed"></div>
  <div id="hint">WASD move/drive · E enter car · F interact · Click shoot · Q punch · Space jump · P pause · C save</div>
  <div id="crosshair">+</div>
</div>
<div id="overlay"><div id="overlay-card">
  <h1 id="overlay-title">SOLARA BAY</h1>
  <div id="overlay-lines"></div>
  <div id="overlay-prompt"></div>
  <button id="start-btn" type="button">Start / Continue</button>
  <button id="new-btn" type="button">New Game</button>
</div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
